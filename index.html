<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>渥美棚卸管理</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
font-family:sans-serif;
background:#f5f5f5;
color:#000;
}

h1{
text-align:center;
margin-bottom:15px;
}

.summary{
background:#fff;
padding:15px;
border-radius:10px;
text-align:center;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.add-area{
display:flex;
gap:10px;
margin-bottom:15px;
}

.add-area input{
flex:1;
}

input{
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
border:none;
border-radius:8px;
cursor:pointer;
}

.add-btn{
background:#28a745;
color:#fff;
padding:12px 20px;
}

.table-wrap{
background:#fff;
border-radius:10px;
overflow-x:auto;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#007bff;
color:#fff;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.product-name{
text-align:left;
font-weight:bold;
min-width:180px;
}

.stock-wrap{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.pm{
width:48px;
height:48px;
background:#666;
color:#fff;
font-size:24px;
font-weight:bold;
border-radius:12px;
}

.stock{
font-size:24px;
font-weight:bold;
min-width:50px;
display:inline-block;
}

.red{
color:red;
font-weight:bold;
}

.name-input{
width:100%;
padding:6px;
border:1px solid #007bff;
border-radius:5px;
font-size:14px;
}

@media(max-width:600px){

body{
padding:10px;
}

th,td{
font-size:12px;
padding:6px;
}

.pm{
width:50px;
height:50px;
font-size:26px;
}

.stock{
font-size:24px;
}
}
</style>

</head>
<body>

<h1>🍾 渥美棚卸管理</h1>

<div class="summary">
総在庫数：
<span id="grandTotal">0</span>
</div>

<div class="add-area">

<input
type="text"
id="productName"
placeholder="商品名">

<button
class="add-btn"
onclick="addProduct()">
追加
</button>

</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>商品名</th>
<th>在庫数</th>
</tr>
</thead>

<tbody id="productList">
</tbody>

</table>

</div>

<script>

let products =
JSON.parse(
localStorage.getItem("inventoryData")
) || [];

/* 古いデータ対策 */

products.forEach(item=>{

if(item.stock===undefined){

if(item.fridge!==undefined || item.shelf!==undefined){

item.stock =
Number(item.fridge || 0) +
Number(item.shelf || 0);

}else{

item.stock = 0;

}

}

});

/* 保存 */

function saveData(){

localStorage.setItem(
"inventoryData",
JSON.stringify(products)
);

}

/* 商品追加 */

function addProduct(){

const name =
document
.getElementById("productName")
.value
.trim();

if(!name){

alert("商品名を入力してください");

return;

}

products.push({

name:name,
stock:0

});

document
.getElementById("productName")
.value="";

saveData();

renderTable();

}

/* 在庫変更 */

function changeStock(
index,
amount
){

products[index].stock =
Number(products[index].stock || 0)
+ amount;

if(products[index].stock < 0){

products[index].stock = 0;

}

saveData();

renderTable();

}

/* 削除 */

function deleteProduct(index){

products.splice(index,1);

saveData();

renderTable();

}

/* 長押し削除 */

let deleteTimer=null;

function startDelete(index){

deleteTimer =
setTimeout(()=>{

if(confirm(
products[index].name +
" を削除しますか？"
)){

deleteProduct(index);

}

},1500);

}

function cancelDelete(){

clearTimeout(deleteTimer);

}

/* 商品名編集 */

function editName(index){

document.getElementById(
"nameText"+index
).style.display="none";

const input =
document.getElementById(
"nameInput"+index
);

input.style.display="block";

input.focus();

input.select();

}

function saveName(index){

const input =
document.getElementById(
"nameInput"+index
);

const value =
input.value.trim();

if(value===""){

input.value =
products[index].name;

}else{

products[index].name = value;

saveData();

}

renderTable();

}

/* 画面描画 */

function renderTable(){

const tbody =
document.getElementById(
"productList"
);

tbody.innerHTML="";

let totalAll = 0;

products.forEach(
(item,index)=>{

const stock =
Number(item.stock || 0);

totalAll += stock;

tbody.innerHTML += `

<tr>

<td class="product-name">

<span

id="nameText${index}"

onclick="editName(${index})"

ontouchstart="startDelete(${index})"
ontouchend="cancelDelete()"

onmousedown="startDelete(${index})"
onmouseup="cancelDelete()"
onmouseleave="cancelDelete()"

style="
cursor:pointer;
display:block;
padding:5px;
">

${item.name}

</span>

<input
type="text"
id="nameInput${index}"
class="name-input"
value="${item.name}"
onblur="saveName(${index})"
style="display:none;">

</td>

<td>

<div class="stock-wrap">

<button
class="pm"
onclick="changeStock(${index},-1)">
－
</button>

<span
class="stock ${
stock===0 ? 'red' : ''
}">
${stock}
</span>

<button
class="pm"
onclick="changeStock(${index},1)">
＋
</button>

</div>

</td>

</tr>

`;

});

document.getElementById(
"grandTotal"
).textContent = totalAll;

}

renderTable();

</script>

</body>
</html>
